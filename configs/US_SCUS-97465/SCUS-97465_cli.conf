# Ratchet: Deadlocked / Ratchet: Gladiator on the PS4 PS2-Classics emulator (Rogue Galaxy v1 donor, revoke 270 branch).
# Put this file next to <TITLE>_config.lua in the emulator's --path-patches folder.

# --- texture filtering ---
--gs-use-mipmap=1
--gs-kernel-cl="mipmap"
--gs-kernel-cl-up="mipmap2x2"

# --- 2x2 internal resolution (remove if your console slows down) ---
--gs-uprender=2x2

# --- maths: THE KEY FIX ---
# VU0/VU1/COP2 result clamping must be OFF: with clamping on (the commonly shared config) Ratchet's skeleton
# gets twisted and the game crashes/hangs on enemy explosions. COP2 flag optimisations must stay at 0,
# otherwise collision fails and Ratchet keeps "falling". FPU clamping stays on.
--cop2-opt-flags=0
--cop2-accurate-mul=1
--fpu-no-clamping=0
--fpu-clamp-results=1
--vu0-no-clamping=1
--vu0-clamp-results=0
--vu1-no-clamping=1
--vu1-clamp-results=0
--cop2-no-clamping=1
--cop2-clamp-results=0

# --- VU1 multithreaded ---
--vu1=jit

# --- DMA / event timing ---
--ee-evt-check-full=1

# --- required by the Scalerize VU0-sync Lua (without it: black screen after "New Game") ---
--ee-hook=0x000FF904,AdvanceClock,,397
--iop-cycle-scalar=0.38

# --- optional diagnostics (EE PC in crash dumps); remove for a little more speed ---
--max-console-spam=100000
--ee-pc-coherency=1
